<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="ChromaSight-AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root{--bg:#EFE4CE;--fg:#2E1F16;--acc:#8A5A3B;--mut:#7A5C45;--line:#C9B48F;--trk:#DCCBA8}
