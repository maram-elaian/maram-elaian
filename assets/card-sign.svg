<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Sign Language Recognition" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root{--bg:#EFE4CE;--fg:#2E1F16;--acc:#8A5A3B;--mut:#7A5C45;--line:#C9B48F;--trk:#DCCBA8}
text{font-family:'Courier Prime','Special Elite','Courier New',Courier,monospace;fill:var(--fg)}
.mut{fill:var(--mut)}.fade{opacity:0;animation:in .8s ease forwards}@keyframes in{to{opacity:1}}
.bd{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.pill{fill:none;stroke:var(--mut);stroke-width:1}.node{fill:none;stroke:var(--fg);stroke-width:1.2}
.bar{fill:var(--acc);transform-box:fill-box;transform-origin:0 50%;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
