<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="Certifications and achievements">

<style>
:root {
  --bg: #EFE4CE;
  --fg: #2E1F16;
  --acc: #8A5A3B;
  --mut: #7A5C45;
  --line: #C9B48F;
  --trk: #DCCBA8;
}

text {
  font-family: 'Courier Prime', 'Special Elite', 'Courier New', Courier, monospace;
  fill: var(--fg);
}

.mut { fill: var(--mut); }

.fade {
  opacity: 0;
  animation: in .8s ease forwards;
}

@keyframes in { to { opacity: 1; } }

.bd {
  fill: none;
  stroke: var(--fg);
  stroke-width: 1.6;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 2.2s ease forwards;
}

@keyframes draw { to { stroke-dashoffset: 0; } }

.pulse { animation: pl 2s ease-in-out infinite; }

@keyframes pl {
  0%, 100% { opacity: .25; }
  50% { opacity: 1; }
}

.pill {
  fill: none;
  stroke: var(--mut);
  stroke-width: 1;
}

.node {
  fill: none;
  stroke: var(--fg);
  stroke-width: 1.2;
}

.bar {
  fill: var(--acc);
  transform-box: fill-box;
  transform-origin: 0 50%;
  animation: grow 8s ease-in-out infinite;
}

@keyframes grow {
  0% { transform: scaleX(0); }
  22%, 88% { transform: scaleX(1); }
  100% { transform: scaleX(0); }
}

.up {
  animation: up .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.arc {
  fill: none;
  stroke: var(--acc);
  stroke-width: 7;
  stroke-linecap: round;
  animation: arc 9s ease-in-out infinite;
}

@keyframes arc {
  0%, 5% { stroke-dasharray: 0 400; }
  30%, 92% { stroke-dasharray: 359 400; }
  96%, 100% { stroke-dasharray: 0 400; }
}

.pop {
  animation: pop 2.6s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes pop {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
</style>

<defs>
  <radialGradient id="vg" cx=".5" cy=".5" r=".78">
    <stop offset=".55" stop-color="#8A5A3B" stop-opacity="0"/>
    <stop offset="1" stop-color="#8A5A3B" stop-opacity=".3"/>
  </radialGradient>

  <filter id="gr" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 .18 0 0 0 0 .12 0 0 0 0 .08 1.2 0 0 0 -.5"/>
  </filter>
</defs>

<!-- Academic card -->
<g class="up" style="animation-delay:.2s">

  <rect x="1" y="1" width="300" height="338" rx="3" fill="#EFE4CE"/>
  <rect x="1" y="1" width="300" height="338" rx="3" fill="url(#vg)"/>

  <rect class="bd" pathLength="1" x="2" y="2" width="298" height="336" rx="3" style="stroke:#2E1F16"/>

  <rect x="7" y="7" width="288" height="326" rx="2" fill="none" stroke="#C9B48F" stroke-width="1"/>

  <text class="mut" style="font-size:10px;letter-spacing:3px" x="26" y="38">ACADEMIC</text>

  <rect class="pill" x="246" y="22" width="32" height="20" rx="3"/>
  <text class="mut" style="font-size:10px" x="262" y="36" text-anchor="middle">AI</text>

  <circle cx="151" cy="152" r="82" fill="none" stroke="#C9B48F" stroke-dasharray="2 7">
    <animateTransform attributeName="transform" type="rotate" from="0 151 152" to="360 151 152" dur="30s" repeatCount="indefinite"/>
  </circle>

  <circle cx="151" cy="152" r="62" fill="none" stroke="#DCCBA8" stroke-width="7"/>

  <circle class="arc" cx="151" cy="152" r="62" transform="rotate(-90 151 152)"/>

  <circle r="4.5" fill="#2E1F16">
    <animateMotion dur="6s" repeatCount="indefinite" path="M151,90 a62,62 0 1,1 0,124 a62,62 0 1,1 0,-124"/>
  </circle>

  <text x="151" y="162" text-anchor="middle" style="font-size:38px;font-weight:700">92.2</text>
  <text class="mut" style="font-size:11px" x="151" y="182" text-anchor="middle">/ 100 GPA</text>

  <text x="151" y="272" text-anchor="middle" style="font-size:15px;font-weight:700">Artificial Intelligence</text>
  <text class="mut" style="font-size:11px" x="151" y="294" text-anchor="middle">Al-Zaytoonah University</text>
  <text class="mut" style="font-size:11px" x="151" y="310" text-anchor="middle">of Jordan</text>

  <rect x="1" y="1" width="300" height="338" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/>

</g>

<!-- IBM certification -->
<g class="up" style="animation-delay:0.5s">

  <rect x="320" y="1" width="240" height="162" rx="3" fill="#EFE4CE"/>
  <rect x="320" y="1" width="240" height="162" rx="3" fill="url(#vg)"/>

  <rect class="bd" pathLength="1" x="321" y="2" width="238" height="160" rx="3" style="stroke:#2E1F16"/>
  <rect x="326" y="7" width="228" height="150" rx="2" fill="none" stroke="#C9B48F" stroke-width="1"/>

  <g transform="translate(342,23)">
    <rect fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x="2" y="6" width="30" height="22" rx="3"/>
    <line fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x1="8" y1="14" x2="22" y2="14"/>
    <line fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x1="8" y1="20" x2="17" y2="20"/>

    <!-- Fixed: only one fill attribute -->
    <circle fill="#EFE4CE" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="pop" cx="28" cy="27" r="6"/>

    <path fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M25 32 L24 39 L28 37 L32 39 L31 32"/>
  </g>

  <rect class="pill" x="496" y="23" width="42" height="20" rx="3"/>
  <text class="mut" style="font-size:10px" x="517" y="37" text-anchor="middle">CERT</text>

  <text style="font-size:14px;font-weight:700" x="342" y="97">AI Fundamentals</text>
  <text style="font-size:14px;font-weight:700" x="342" y="117">Certification</text>

  <line x1="342" y1="129" x2="538" y2="129" stroke="#C9B48F"/>

  <text class="mut" style="font-size:10px" x="342" y="149">IBM / 2026</text>

  <rect x="320" y="1" width="240" height="162" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/>

</g>

<!-- Edraak certification -->
<g class="up" style="animation-delay:0.8s">

  <rect x="576" y="1" width="240" height="162" rx="3" fill="#EFE4CE"/>
  <rect x="576" y="1" width="240" height="162" rx="3" fill="url(#vg)"/>

  <rect class="bd" pathLength="1" x="577" y="2" width="238" height="160" rx="3" style="stroke:#2E1F16"/>
  <rect x="582" y="7" width="228" height="150" rx="2" fill="none" stroke="#C9B48F" stroke-width="1"/>

  <g transform="translate(598,23)">
    <g>
      <path fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 3 L24.5 15.5 L37 20 L24.5 24.5 L20 37 L15.5 24.5 L3 20 L15.5 15.5 Z"/>

      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect class="pill" x="752" y="23" width="42" height="20" rx="3"/>
  <text class="mut" style="font-size:10px" x="773" y="37" text-anchor="middle">CERT</text>

  <text style="font-size:14px;font-weight:700" x="598" y="97">Introduction to AI</text>
  <text style="font-size:14px;font-weight:700" x="598" y="117">&amp; Generative AI</text>

  <line x1="598" y1="129" x2="794" y2="129" stroke="#C9B48F"/>

  <text class="mut" style="font-size:10px" x="598" y="149">Edraak / 2026</text>

  <rect x="576" y="1" width="240" height="162" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/>

</g>

<!-- Training -->
<g class="up" style="animation-delay:1.1s">

  <rect x="320" y="177" width="240" height="162" rx="3" fill="#EFE4CE"/>
  <rect x="320" y="177" width="240" height="162" rx="3" fill="url(#vg)"/>

  <rect class="bd" pathLength="1" x="321" y="178" width="238" height="160" rx="3" style="stroke:#2E1F16"/>
  <rect x="326" y="183" width="228" height="150" rx="2" fill="none" stroke="#C9B48F" stroke-width="1"/>

  <g transform="translate(342,199)">
    <rect fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x="2" y="12" width="36" height="24" rx="3"/>
    <path fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 12 V8 a3 3 0 0 1 3 -3 H23 a3 3 0 0 1 3 3 V12"/>
    <path fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 23 H38"/>
    <rect x="17" y="20" width="6" height="7" fill="#EFE4CE" stroke="#2E1F16" stroke-width="1.8"/>
  </g>

  <rect class="pill" x="471" y="199" width="67" height="20" rx="3"/>
  <text class="mut" style="font-size:10px" x="504.5" y="213" text-anchor="middle">TRAINING</text>

  <text style="font-size:14px;font-weight:700" x="342" y="273">Trainee</text>
  <text style="font-size:14px;font-weight:700" x="342" y="293">Adaptive TechSoft Co.</text>

  <line x1="342" y1="305" x2="538" y2="305" stroke="#C9B48F"/>

  <text class="mut" style="font-size:10px" x="342" y="325">ATS / Industry Training</text>

  <rect x="320" y="177" width="240" height="162" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/>

</g>

<!-- Volunteer -->
<g class="up" style="animation-delay:1.4s">

  <rect x="576" y="177" width="240" height="162" rx="3" fill="#EFE4CE"/>
  <rect x="576" y="177" width="240" height="162" rx="3" fill="url(#vg)"/>

  <rect class="bd" pathLength="1" x="577" y="178" width="238" height="160" rx="3" style="stroke:#2E1F16"/>
  <rect x="582" y="183" width="228" height="150" rx="2" fill="none" stroke="#C9B48F" stroke-width="1"/>

  <g transform="translate(598,199)">
    <path fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 14 H10 L13 9 H27 L30 14 H38 V32 H2 Z"/>

    <circle fill="none" stroke="#2E1F16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="20" cy="23" r="6.5"/>

    <circle cx="20" cy="23" r="2.4" fill="#8A5A3B">
      <animate attributeName="r" values="2.4;4;2.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect class="pill" x="720" y="199" width="74" height="20" rx="3"/>
  <text class="mut" style="font-size:10px" x="757" y="213" text-anchor="middle">VOLUNTEER</text>

  <text style="font-size:14px;font-weight:700" x="598" y="273">Media &amp; Documentation</text>
  <text style="font-size:14px;font-weight:700" x="598" y="293">Volunteer</text>

  <line x1="598" y1="305" x2="794" y2="305" stroke="#C9B48F"/>

  <text class="mut" style="font-size:10px" x="598" y="325">Global Entrepreneurship Week 2025</text>

  <rect x="576" y="177" width="240" height="162" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/>

</g>

</svg>
