.pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.pill{fill:none;stroke:var(--mut);stroke-width:1}.node{fill:none;stroke:var(--fg);stroke-width:1.2}
.bar{fill:var(--acc);transform-box:fill-box;transform-origin:0 50%;animation:grow 8s ease-in-out infinite}
