<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Maram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root{--bg:#EFE4CE;--fg:#2E1F16;--acc:#8A5A3B;--mut:#7A5C45;--line:#C9B48F;--trk:#DCCBA8}
text{font-family:'Courier Prime','Special Elite','Courier New',Courier,monospace;fill:var(--fg)}
.mut{fill:var(--mut)}.fade{opacity:0;animation:in .8s ease forwards}@keyframes in{to{opacity:1}}
