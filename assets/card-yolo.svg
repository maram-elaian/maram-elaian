pill" x="89.2" y="164" width="53.2" height="20" rx="3"/><text class="mut" style="font-size:10px" x="97.2" y="178">Python</text><rect class="pill" x="150.4" y="164" width="53.2" height="20" rx="3"/><text class="mut" style="font-size:10px" x="158.4" y="178">OpenCV</text><rect x="1" y="1" width="438" height="198" rx="3" fill="#000" filter="url(#gr)" opacity=".55"/></svg>